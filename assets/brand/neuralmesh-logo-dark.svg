<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Transparent background (no rect) — white variant for dark surfaces -->
  <defs>
    <filter id="glow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mesh lines (outer ring) -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.25">
    <line x1="60" y1="18" x2="96.4" y2="39"/>
    <line x1="96.4" y1="39" x2="96.4" y2="81"/>
    <line x1="96.4" y1="81" x2="60" y2="102"/>
    <line x1="60" y1="102" x2="23.6" y2="81"/>
    <line x1="23.6" y1="81" x2="23.6" y2="39"/>
    <line x1="23.6" y1="39" x2="60" y2="18"/>
  </g>

  <!-- Spoke lines -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.45">
    <line x1="60" y1="60" x2="60" y2="18"/>
    <line x1="60" y1="60" x2="96.4" y2="39"/>
    <line x1="60" y1="60" x2="96.4" y2="81"/>
    <line x1="60" y1="60" x2="60" y2="102"/>
    <line x1="60" y1="60" x2="23.6" y2="81"/>
    <line x1="60" y1="60" x2="23.6" y2="39"/>
  </g>

  <!-- Cross-diagonal lines -->
  <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.12">
    <line x1="60" y1="18" x2="96.4" y2="81"/>
    <line x1="96.4" y1="39" x2="60" y2="102"/>
    <line x1="96.4" y1="39" x2="23.6" y2="81"/>
    <line x1="60" y1="18" x2="23.6" y2="81"/>
    <line x1="23.6" y1="39" x2="96.4" y2="81"/>
    <line x1="23.6" y1="39" x2="60" y2="102"/>
  </g>

  <!-- Outer nodes -->
  <g filter="url(#glow-dark)">
    <circle cx="60" cy="18" r="3.5" fill="#FFFFFF"/>
    <circle cx="96.4" cy="39" r="3.5" fill="#FFFFFF"/>
    <circle cx="96.4" cy="81" r="3.5" fill="#FFFFFF"/>
    <circle cx="60" cy="102" r="3.5" fill="#FFFFFF"/>
    <circle cx="23.6" cy="81" r="3.5" fill="#FFFFFF"/>
    <circle cx="23.6" cy="39" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Center node -->
  <circle cx="60" cy="60" r="5.5" fill="#FFFFFF" opacity="0.5" filter="url(#glow-dark)"/>
  <circle cx="60" cy="60" r="3" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="128" y="52" font-family="'Space Grotesk', 'Inter', sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Neural</tspan><tspan fill="#FFFFFF" opacity="0.6">Mesh</tspan>
  </text>
  <text x="128" y="76" font-family="'Inter', sans-serif"
        font-size="11" font-weight="400" letter-spacing="2.5"
        fill="#FFFFFF" opacity="0.35">DECENTRALIZED AI COMPUTE</text>
</svg>
