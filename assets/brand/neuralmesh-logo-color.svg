<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" fill="#0A0E1A" rx="8"/>

  <!-- Icon: hexagonal mesh (center 60,60 radius 42) -->
  <!-- Nodes: center + 6 outer at 60° intervals from top -->
  <!-- Center: (60,60) -->
  <!-- N1 top:        (60, 18) -->
  <!-- N2 top-right:  (96.4, 39) -->
  <!-- N3 bot-right:  (96.4, 81) -->
  <!-- N4 bottom:     (60, 102) -->
  <!-- N5 bot-left:   (23.6, 81) -->
  <!-- N6 top-left:   (23.6, 39) -->

  <!-- Mesh lines (outer ring) -->
  <g stroke="#00D4FF" stroke-width="1.2" opacity="0.35" filter="url(#glow)">
    <line x1="60" y1="18" x2="96.4" y2="39"/>
    <line x1="96.4" y1="39" x2="96.4" y2="81"/>
    <line x1="96.4" y1="81" x2="60" y2="102"/>
    <line x1="60" y1="102" x2="23.6" y2="81"/>
    <line x1="23.6" y1="81" x2="23.6" y2="39"/>
    <line x1="23.6" y1="39" x2="60" y2="18"/>
  </g>

  <!-- Spoke lines (outer to center) -->
  <g stroke="#00D4FF" stroke-width="1.2" opacity="0.5" filter="url(#glow)">
    <line x1="60" y1="60" x2="60" y2="18"/>
    <line x1="60" y1="60" x2="96.4" y2="39"/>
    <line x1="60" y1="60" x2="96.4" y2="81"/>
    <line x1="60" y1="60" x2="60" y2="102"/>
    <line x1="60" y1="60" x2="23.6" y2="81"/>
    <line x1="60" y1="60" x2="23.6" y2="39"/>
  </g>

  <!-- Cross-diagonal lines (non-adjacent outer nodes) -->
  <g stroke="#7B2FFF" stroke-width="0.8" opacity="0.3">
    <line x1="60" y1="18" x2="96.4" y2="81"/>
    <line x1="96.4" y1="39" x2="60" y2="102"/>
    <line x1="96.4" y1="39" x2="23.6" y2="81"/>
    <line x1="60" y1="18" x2="23.6" y2="81"/>
    <line x1="23.6" y1="39" x2="96.4" y2="81"/>
    <line x1="23.6" y1="39" x2="60" y2="102"/>
  </g>

  <!-- Outer nodes -->
  <g filter="url(#glow)">
    <circle cx="60" cy="18" r="3.5" fill="#00D4FF"/>
    <circle cx="96.4" cy="39" r="3.5" fill="#00D4FF"/>
    <circle cx="96.4" cy="81" r="3.5" fill="#00D4FF"/>
    <circle cx="60" cy="102" r="3.5" fill="#00D4FF"/>
    <circle cx="23.6" cy="81" r="3.5" fill="#00D4FF"/>
    <circle cx="23.6" cy="39" r="3.5" fill="#00D4FF"/>
  </g>

  <!-- Center node (accent, larger) -->
  <circle cx="60" cy="60" r="5.5" fill="#7B2FFF" filter="url(#glow-strong)"/>
  <circle cx="60" cy="60" r="3" fill="#00D4FF"/>

  <!-- Wordmark -->
  <text x="128" y="52" font-family="'Space Grotesk', 'Inter', sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#E8EAED">Neural</tspan><tspan fill="#00D4FF">Mesh</tspan>
  </text>
  <text x="128" y="76" font-family="'Inter', sans-serif"
        font-size="11" font-weight="400" letter-spacing="2.5"
        fill="#4A5568">DECENTRALIZED AI COMPUTE</text>
</svg>
